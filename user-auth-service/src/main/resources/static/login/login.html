<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in</title>
    <link rel="stylesheet" href="/login/css/styles.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>Welcome</h1>
        <p class="subtitle">Sign in or create your account in one step</p>
        <div class="providers">
          <a class="btn google" href="/oauth2/authorization/google" aria-label="Continue with Google">
            <img src="/login/img/google-icon.png" alt="Google" />
            Continue with Google
          </a>
          <a class="btn github" href="/oauth2/authorization/github" aria-label="Continue with GitHub">
            <img src="/login/img/github-icon.png" alt="GitHub" />
            Continue with GitHub
          </a>
        </div>
      </div>
    </div>
  </body>
</html>
