spring:
  datasource:
    url: ${POSTGRES_URI:jdbc:postgresql://localhost:5432/auth-db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
  security:
    oauth2:
      client:
        registration:
          google:
            # Generate new keys:
            # https://console.cloud.google.com/
            # Create new project > "APIs & Services" > "OAuth consent screen"
            client-id: ${GOOGLE_CLIENT_ID:your_google_client_id}
            client-secret: ${GOOGLE_CLIENT_SECRET:your_google_client_secret}
            scope: openid, profile, email
            redirect-uri: ${URL_GATEWAY:{baseUrl}}/login/oauth2/code/{registrationId}
            client-name: Google
          github:
            # Generate new keys:
            # https://github.com/settings/developers
            client-id: ${GITHUB_CLIENT_ID:your_github_client_id}
            client-secret: ${GITHUB_CLIENT_SECRET:your_github_client_secret}
            scope: read:user, user:email
            redirect-uri: ${URL_GATEWAY:{baseUrl}}/login/oauth2/code/{registrationId}
            client-name: GitHub
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth?prompt=login
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            user-name-attribute: sub
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: id

auth:
  base-url: ${HOME_PAGE:http://localhost:8080}
  public-paths:
    - "/login"
    - "/logout"
    - "/login/**"
    - "/oauth2/**"
    - "/actuator/*"
